{% load static %}
{% load django_bootstrap5 %}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}ArduinoWiki — Guía del Prototipado{% endblock %}</title>
<!-- Carga Bootstrap 5 -->
{% bootstrap_css %}
{% bootstrap_javascript %}
<!-- Tipografías vintage: Special Elite (máquina de escribir), Zilla Slab (texto), IBM Plex Mono (fichas técnicas) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- CSS Propio -->
<link rel="stylesheet" href="{% static 'portal/css/estilos.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">
<!-- Navbar reutilizable -->
{% include 'portal/navbar.html' %}
<!-- Contenido Dinámico -->
<main class="container my-4 flex-grow-1">
{% block content %}
{% endblock %}
</main>
<!-- Footer -->
<footer class="site-footer text-center py-3 mt-auto">
<small>Ficha N.º 01 — Proyecto ArduinoWiki — Desarrollo Web</small>
</footer>
</body>
</html>
